      <stop offset="0.46" stop-color="#C87532" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#C87532" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haze" cx="0.5" cy="0.86" r="0.8">
