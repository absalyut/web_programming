<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Position the Badge</title>
<style>
  .card {
    width: 280px;
    height: 180px;
    background: white;
    border: 2px solid #14b8a6;
    border-radius: 12px;
    position: relative;
    margin: 40px;
  }
  .badge {
    position: absolute;
    top: -12px;
    right: 16px;
    background: #0f766e;
    color: white;
    font-size: 12px;
    font-weight: bold;
    padding: 4px 12px;
    border-radius: 20px;
  }
</style>
  <link rel="stylesheet" href="../course-theme.css">
</head>
<body>
  <div class="card">
    <span class="badge">SALE</span>
    <p style="padding:16px;color:#0f766e;font-weight:bold">Card content here</p>
  </div>
</body>
</html>
