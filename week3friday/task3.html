<!DOCTYPE html>

<meta charset="UTF-8">
<title>Loading Spinner</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 200px;
    background: #f0fdfa;
  }

  @keyframes spin {
    from {
      transform: rotate(0deg);
    }
    to {
      transform: rotate(360deg);
    }
  }

  .spinner {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 4px solid #ccfbf1;
    border-top-color: #0f766e;
    animation: spin 0.8s linear infinite;
  }
</style>
  <link rel="stylesheet" href="../course-theme.css">
  <link rel="stylesheet" href="../dune-theme.css">
</head>
<body>
  <div class="spinner"></div>
  <script src="../dune.js" data-root="../" data-week="Week 3 · Friday" defer></script>
</body>
</html>
