<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dark mode toggle</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
      display: flex;
      justify-content: center;
    }
    .card {
      padding: 24px;
      border-radius: 16px;
      width: 260px;
      background: #f0f4ff;
      border: 2px solid #c8d4f0;
      text-align: center;
      transition: all 0.3s;
    }
    .card.dark {
      background: #1a2340;
      border-color: #3a4a70;
      color: white;
    }
    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #1a56db;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 12px;
    }
    button {
      padding: 8px 20px;
      border-radius: 20px;
      cursor: pointer;
      border: none;
      margin-top: 14px;
      font-weight: bold;
      background: #e8eefa;
      color: #1a2340;
    }
  </style>
  <link rel="stylesheet" href="../course-theme.css">
</head>
<body>
  <div id="card" class="card">
    <div class="avatar">👨‍💻</div>
    <h2>Elbek</h2>
    <p>web programming student</p>
    <button id="toggle-btn">🌙 dark mode</button>
  </div>

  <script>
    const card = document.querySelector('#card');
    const btn = document.querySelector('#toggle-btn');

    btn.addEventListener('click', () => {
      card.classList.toggle('dark');
      if (card.classList.contains('dark')) {
        btn.textContent = '☀️ light mode';
      } else {
        btn.textContent = '🌙 dark mode';
      }
    });
  </script>
</body>
</html>
