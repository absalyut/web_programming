<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>random joke generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }
    .card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      padding: 28px;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 8px;
      color: #0f172a;
    }
    p.subtitle {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 20px;
    }
    .joke-container {
      background-color: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 20px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-bottom: 16px;
    }
    .setup {
      font-size: 1.05rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 10px;
    }
    .punchline {
      font-size: 1rem;
      color: #2563eb;
      font-weight: 500;
    }
    .status-area {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 28px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: #64748b;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #cbd5e1;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .error-msg {
      color: #dc2626;
      font-size: 0.9rem;
      display: none;
    }
    .buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    button {
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background-color: #f8fafc;
      color: #1e293b;
      cursor: pointer;
    }
    button.primary {
      background-color: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }
    button.primary:hover {
      background-color: #1d4ed8;
    }
    button:hover:not(:disabled) {
      background-color: #e2e8f0;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .favorites-section {
      border-top: 1px solid #e2e8f0;
      padding-top: 18px;
    }
    .favorites-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .favorites-header h2 {
      font-size: 1rem;
      color: #334155;
    }
    .favorites-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
    }
    .fav-item {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .fav-text {
      flex: 1;
    }
    .fav-text strong {
      display: block;
      color: #1e293b;
    }
    .fav-text span {
      color: #2563eb;
    }
    .remove-btn {
      padding: 4px 8px;
      font-size: 0.75rem;
      background: none;
      border: 1px solid #e2e8f0;
      color: #dc2626;
      border-radius: 4px;
    }
    .remove-btn:hover {
      background-color: #fee2e2;
    }
    .empty-fav {
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
  <link rel="stylesheet" href="../course-theme.css">
</head>
<body>

  <div class="card">
    <h1>random joke generator</h1>
    <p class="subtitle">fetch api with async/await and local storage</p>

    <div class="joke-container">
      <div id="setup" class="setup">click the button to load a joke</div>
      <div id="punchline" class="punchline"></div>
    </div>

    <div class="status-area">
      <div id="spinner" class="spinner"></div>
      <span id="status">ready</span>
      <span id="error" class="error-msg"></span>
    </div>

    <div class="buttons">
      <button id="fetchBtn" class="primary" onclick="loadJoke()">load joke</button>
      <button id="favBtn" onclick="saveFavorite()" disabled>save favourite</button>
    </div>

    <div class="favorites-section">
      <div class="favorites-header">
        <h2>saved favourites</h2>
        <button onclick="clearFavorites()" class="remove-btn">clear all</button>
      </div>
      <ul id="favoritesList" class="favorites-list"></ul>
    </div>
  </div>

  <script>
    let currentJoke = null;

    async function loadJoke() {
      const fetchBtn = document.getElementById('fetchBtn');
      const favBtn = document.getElementById('favBtn');
      const spinner = document.getElementById('spinner');
      const status = document.getElementById('status');
      const errorEl = document.getElementById('error');
      const setupEl = document.getElementById('setup');
      const punchlineEl = document.getElementById('punchline');

      fetchBtn.disabled = true;
      favBtn.disabled = true;
      spinner.style.display = 'block';
      status.textContent = 'loading...';
      errorEl.style.display = 'none';
      errorEl.textContent = '';

      try {
        const response = await fetch('https://official-joke-api.appspot.com/random_joke');
        if (!response.ok) {
          throw new Error('network response was not ok (' + response.status + ')');
        }

        const data = await response.json();
        if (!data.setup || !data.punchline) {
          throw new Error('invalid joke data format');
        }

        currentJoke = {
          setup: data.setup,
          punchline: data.punchline,
          id: data.id || Date.now()
        };

        setupEl.textContent = currentJoke.setup;
        punchlineEl.textContent = currentJoke.punchline;
        status.textContent = 'joke loaded';
        favBtn.disabled = false;
      } catch (err) {
        setupEl.textContent = 'unable to display joke';
        punchlineEl.textContent = '';
        errorEl.textContent = 'failed to load: ' + err.message;
        errorEl.style.display = 'inline';
        status.textContent = '';
      } finally {
        spinner.style.display = 'none';
        fetchBtn.disabled = false;
      }
    }

    function getFavorites() {
      try {
        const stored = localStorage.getItem('favorite_jokes');
        return stored ? JSON.parse(stored) : [];
      } catch (e) {
        return [];
      }
    }

    function renderFavorites() {
      const list = document.getElementById('favoritesList');
      const items = getFavorites();
      list.innerHTML = '';

      if (items.length === 0) {
        list.innerHTML = '<li class="empty-fav">no saved jokes yet</li>';
        return;
      }

      items.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = 'fav-item';

        const textDiv = document.createElement('div');
        textDiv.className = 'fav-text';
        textDiv.innerHTML = '<strong>' + item.setup + '</strong><span>' + item.punchline + '</span>';

        const btn = document.createElement('button');
        btn.className = 'remove-btn';
        btn.textContent = 'remove';
        btn.onclick = () => removeFavorite(index);

        li.appendChild(textDiv);
        li.appendChild(btn);
        list.appendChild(li);
      });
    }

    function saveFavorite() {
      if (!currentJoke) return;
      const favorites = getFavorites();
      const exists = favorites.some(item => item.setup === currentJoke.setup);
      if (!exists) {
        favorites.unshift(currentJoke);
        localStorage.setItem('favorite_jokes', JSON.stringify(favorites));
        renderFavorites();
      }
    }

    function removeFavorite(index) {
      const favorites = getFavorites();
      favorites.splice(index, 1);
      localStorage.setItem('favorite_jokes', JSON.stringify(favorites));
      renderFavorites();
    }

    function clearFavorites() {
      localStorage.removeItem('favorite_jokes');
      renderFavorites();
    }

    renderFavorites();
  </script>

</body>
</html>
